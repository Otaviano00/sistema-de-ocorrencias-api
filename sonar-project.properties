# SonarQube / SonarCloud — API (NestJS)
# Host e token vêm do ambiente: SONAR_HOST_URL e SONAR_TOKEN.
sonar.projectKey=sistema-de-ocorrencias-api
sonar.projectName=Sistema de Ocorrencias - API
# sonar.organization=<org>   # obrigatório apenas no SonarCloud
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,test
sonar.exclusions=src/generated/**,**/*.spec.ts,**/*.e2e-spec.ts
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
