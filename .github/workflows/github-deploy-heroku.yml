name: Deploy API to Heroku

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: PRD
      url: https://api.otav.com.br

    env:
      HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
      IMAGE_TAG: registry.heroku.com/${{ vars.HEROKU_APP_NAME }}/web

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build & Push with Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release new version on Heroku
        run: |
          IMAGE_ID=$(docker buildx imagetools inspect ${{ env.IMAGE_TAG }} --raw | jq -r '.config.digest')
          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "null" ]; then
            echo "Erro: Não foi possível extrair o config.digest da imagem."
            exit 1
          fi
          curl --fail-with-body --show-error -X PATCH https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/formation \
            -d "{
              \"updates\": [
                {
                  \"type\": \"web\",
                  \"docker_image\": \"$IMAGE_ID\"
                }
              ]
            }" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}"